name: ParquetLiveSync Windows Parquet file-lock and annual/monthly layout tests

on:
  push:
    branches:
      - feat/a-stock-data-parquet-sync-20261112
    paths:
      - "ParquetLiveSync/**"
      - ".github/workflows/parquet-live-sync-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-parquet-only:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated binary Arrow library
        run: python -m pip install "pyarrow>=15,<30"
      - name: Compile ParquetLiveSync scripts without importing market files
        run: python -m compileall -q ParquetLiveSync
      - name: Validate Windows PowerShell update/task installer syntax without execution
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Get-ChildItem ParquetLiveSync -Filter '*.ps1' -File | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -ne 0){throw "PowerShell parse failed for $($_.Name): $($errors | Out-String)"}
            Write-Host "PASS_PS_PARSE $($_.Name)"
          }
      - name: Exercise Windows PowerShell 5.1 Task Scheduler INSTALL logic with mocked cmdlets (NO actual task)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ParquetLiveSync/tests/test_install_schedule_mock.ps1
      - name: Run only offline synthetic ZIP/Arrow and local annual/monthly file tests
        run: python -B -m unittest discover -s ParquetLiveSync/tests -p "test_*.py" -v
      - name: Optional genuine Tencent upstream 1min OHLCV live source probe (SHA private candidate, no amount)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: python -B ParquetLiveSync/tencent_m1.py --symbol SH600000 --count 320
      - name: Optional public Eastmoney all five minute-cycle Shanghai pilot (private raw only)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: python -B ParquetLiveSync/minute_probe.py --symbols SH600000 --periods 1min,5min,15min,30min,60min
      - name: Optional read-only historical 5-60min and 1min Kline real-end-date pagination probe
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: python -B ParquetLiveSync/probe_minute_history_window.py
      - name: Optional read-only public TDX Sep30 unit-overlap anchor quality probe
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: python -B ParquetLiveSync/probe_official_zip_readonly.py --date 2026-09-30
      - name: Optional read-only public TDX 2026-10-14 ZIP quality probe (no local licensed data)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: python -B ParquetLiveSync/probe_official_zip_readonly.py --date 2026-10-14
